version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: company-inventory-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_password_123
      POSTGRES_DB: company_inventory_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
